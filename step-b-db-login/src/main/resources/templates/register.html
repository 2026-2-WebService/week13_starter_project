<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header>Week 13 · Spring Security Lab</header><main><h1>Register</h1><nav><a th:href="@{/}">Home</a><a th:href="@{/mypage}">My Page</a><a th:href="@{/admin}">Admin</a><a th:href="@{/register}">Register</a><a th:href="@{/login}">Login</a></nav><p>New accounts always get USER role.</p><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" th:object="${form}" method="post"><label>Username<input th:field="*{username}" required minlength="3" maxlength="30"></label><span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span><label>Password<input th:field="*{password}" type="password" required minlength="6"></label><span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><button type="submit">Create account</button></form><p>Thymeleaf inserts the CSRF token automatically for this POST form.</p></main></body></html>
