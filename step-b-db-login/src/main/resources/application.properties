server.port=8080
# External MariaDB: configure these three environment variables in IntelliJ.
# No default credentials are stored in the project.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Class lab only: allows JPA to create/update Member table in the assigned schema.
# Only use in the database/schema allocated to you; never on a shared production schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
